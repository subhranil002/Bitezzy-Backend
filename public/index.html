<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Razorpay Subscription Tester</title>

    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #111827;
            color: white;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .card {
            width: 450px;
            background: #1f2937;
            padding: 30px;
            border-radius: 12px;
        }

        h1 {
            margin-bottom: 25px;
            text-align: center;
            color: #60a5fa;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border: none;
            outline: none;
            border-radius: 8px;
            background: #374151;
            color: white;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        .message {
            margin-top: 20px;
            padding: 12px;
            border-radius: 8px;
            text-align: center;
            font-weight: bold;
        }

        .success {
            background: #065f46;
        }

        .error {
            background: #7f1d1d;
        }
    </style>
</head>
<body>

    <div class="card">

        <h1>Subscription Payment Test</h1>

        <input
            type="text"
            id="chefId"
            placeholder="Chef ID"
        />

        <button onclick="startSubscription()">
            Subscribe Now
        </button>

        <div id="message"></div>

    </div>

    <script>

        const BASE_URL = "https://api.bitezzy.store/api/payment";

        function showMessage(text, type) {

            const messageDiv =
                document.getElementById("message");

            messageDiv.innerHTML = text;

            messageDiv.className =
                `message ${type}`;
        }

        async function startSubscription() {

            try {

                const chefId =
                    document.getElementById("chefId").value;

                // Create subscription from backend
                const response = await fetch(
                    `${BASE_URL}/create-subscription`,
                    {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json",
                        },
                        body: JSON.stringify({
                            chefId
                        })
                    }
                );

                const result = await response.json();

                console.log(result);

                if (!response.ok) {
                    throw new Error(
                        result.message || "Subscription creation failed"
                    );
                }

                const subscription = result.data;

                // Open Razorpay Checkout
                const options = {

                    key: "rzp_test_SCUO1oICePKOkW",

                    subscription_id: subscription.id,

                    name: "Recipe App",

                    description: "Chef Subscription",

                    theme: {
                        color: "#2563eb"
                    },

                    handler: function (response) {

                        console.log(response);

                        showMessage(
                            "Payment Successful ✅",
                            "success"
                        );
                    }
                };

                const razorpay =
                    new Razorpay(options);

                // Payment Failed
                razorpay.on(
                    "payment.failed",
                    function (response) {

                        console.log(response);

                        showMessage(
                            "Payment Failed ❌",
                            "error"
                        );
                    }
                );

                razorpay.open();

            } catch (error) {

                console.log(error);

                showMessage(
                    error.message,
                    "error"
                );
            }
        }

    </script>

</body>
</html>
